# The overlay targets the systemd profile (default/linux/arm64/23.0/systemd).
# NonsolvableDeps checks also test OpenRC/split-usr/hardened profiles where
# sys-apps/systemd is masked by design, so those results are profile
# artifacts, not real dependency problems: the full set resolves cleanly
# (emerge -pv @aurora-m2-air, 199 packages) on the systemd profile.
# UnknownCategoryDirs: sets/ is Portage's required location for package
# sets (see sets.conf) and docs/ holds documentation; neither is a
# package category.
[DEFAULT]
keywords = -NonsolvableDepsInStable,-NonsolvableDepsInDev,-UnknownCategoryDirs
