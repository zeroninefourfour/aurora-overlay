# pkgcheck configuration for the gentoo-aurora overlay.
#
# This overlay targets the systemd arm64 profile only (Aurora machines
# boot systemd; the stage3 used for development is the systemd variant).
# ::gentoo's stable OpenRC and split-usr profiles mask sys-apps/systemd
# by design, so dep-solvability of systemd-requiring packages against
# those profiles can never succeed and is not a meaningful QA signal
# here. The set was verified to resolve on the systemd profile
# (emerge -pv @aurora-m2-air, 199 packages, RC=0). Disable only the
# stable-profile solvability keyword; all other checks stay enabled.
[DEFAULT]
keywords = -NonsolvableDepsInStable
